<!DOCTYPE html>
<html>
<head>
  <title>EdgeNet Node</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="header">
    <h1>EdgeNet Node Dashboard</h1>
  </div>
  
  <div class="content">
    <div class="status-card">
      <div class="loader-container">
        <div class="giftbox"></div>
      </div>
      
      <p class="status-text">Node Status:</p>
      <p class="node-status" id="nodeStatus">Offline</p>
      
      <button class="action-button" id="toggleButton">Start Node</button>
    </div>
    
    <div class="stats-panel">
      <div class="stat-row">
        <span class="stat-label">Uptime:</span>
        <span class="stat-value" id="uptime">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Points Earned:</span>
        <span class="stat-value" id="points">0</span>
      </div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
